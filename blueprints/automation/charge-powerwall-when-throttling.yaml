blueprint:
  name: "Solar Battery Reserve Manager"
  description: >
    Raises a Tesla Powerwall backup reserve to absorb excess solar when
    structural export (solar CT minus genuine household load) exceeds a
    configurable threshold, and restores it once solar drops sustainably
    below that threshold.

    Unlike the previous dispatch-switch approach, this blueprint reads
    solar and load directly — independently of whether the inverter is
    throttling or the battery is charging. This breaks the feedback loop
    where battery charging suppresses throttling which resets the reserve
    which stops battery charging which resumes throttling.

    Formula: structural_export = solar_ct_power - load_power
    (battery power is deliberately excluded: it is discretionary and
    does not reflect genuine solar generation available for export)

    Raise reserve: structural_export > solar_threshold_w, sustained for
    raise_hold_minutes.
    Lower reserve: structural_export <= solar_threshold_w, sustained for
    lower_hold_minutes (longer to ride out brief cloud cover).

    Octopus cheap-rate guard: the blueprint will never lower the reserve
    during an Octopus cheap rate window (detected as current_rate < next_rate).
    This covers both the fixed overnight Go window and any Intelligent dispatch
    slots during the day, preventing conflict with the Octopus charging automation.

    **Version: 2.5**

    Prerequisites:
      - Solar CT clamp sensor for the phase
      - Load sensor for the phase
      - Tesla Fleet integration providing the battery backup_reserve number entity
      - (Optional) notification service for reserve-change alerts

  domain: automation
  author: "Ralf Holighaus / Claude"
  source_url: "https://github.com/rholighaus/ha_blueprints/blob/main/blueprints/automation/charge-powerwall-when-throttling.yaml"
  input:
    phase_name:
      name: "Phase / Battery Name"
      description: >
        Human-readable label used in notifications, e.g. "Phase A" or "Grange A".
      default: "Battery"
      selector:
        text:

    solar_ct_sensor:
      name: "Solar CT Sensor"
      description: >
        CT clamp sensor measuring solar generation for this phase
        (e.g. sensor.solar_a_power). Absolute value is used so
        reversed CT clamp wiring is handled automatically.
      selector:
        entity:
          domain: sensor

    load_sensor:
      name: "Load Sensor"
      description: >
        Sensor measuring genuine household load for this phase
        (e.g. sensor.load_a_power). Battery charge/discharge power
        is intentionally excluded from this value.
      selector:
        entity:
          domain: sensor

    solar_threshold_w:
      name: "Solar Export Threshold (W)"
      description: >
        Structural export level (solar CT - load) above which the battery
        reserve is raised. Set to match the G100 safety target for this
        phase, e.g. 6650 for Phase B (7000W limit, 5% margin) or
        7600 for Phase C (8000W limit, 5% margin).
      default: 6000
      selector:
        number:
          min: 500
          max: 15000
          step: 100
          unit_of_measurement: "W"
          mode: box

    raise_hold_minutes:
      name: "Raise Hold (minutes)"
      description: >
        Solar must stay above threshold for this many minutes before the
        reserve is raised. Prevents reaction to brief cloud gaps.
        Default: 2 minutes.
      default: 2
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "min"
          mode: box

    lower_hold_minutes:
      name: "Lower Hold (minutes)"
      description: >
        Solar must stay below threshold for this many minutes before the
        reserve is restored to normal. Longer than raise_hold to ride
        out cloud cover while battery charges. Default: 10 minutes.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: "min"
          mode: box

    backup_reserve_number:
      name: "Battery Backup Reserve Number"
      description: >
        Tesla Fleet number entity controlling the backup reserve percentage
        (e.g. number.the_grange_a_backup_reserve).
      selector:
        entity:
          domain: number

    battery_soc_sensor:
      name: "Battery SoC Sensor (optional)"
      description: >
        Sensor reporting battery % charged. Used only for notification
        messages. Leave empty if not needed.
      default:
      selector:
        entity:
          domain: sensor
          device_class: battery

    throttle_reserve_pct:
      name: "Reserve % when solar is high"
      description: >
        Backup reserve to set when structural export exceeds the threshold.
        100% forces the battery to charge from surplus solar.
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider

    normal_reserve_pct:
      name: "Reserve % when solar is low"
      description: >
        Backup reserve to restore when structural export drops below the
        threshold. Set to your normal standby value (e.g. 20).
      default: 20
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider

    battery_power_sensor:
      name: "Battery Power Sensor (optional)"
      description: >
        Sensor measuring battery charge/discharge power for this phase
        (e.g. sensor.battery_c_power). Only used when
        include_battery_in_forecast is true. Negative = charging,
        positive = discharging.
      default:
      selector:
        entity:
          domain: sensor

    include_battery_in_forecast:
      name: "Include battery power in structural export forecast"
      description: >
        When enabled, the structural export formula becomes
        solar_ct - load + battery_power. This accounts for battery
        discharge adding to export, but makes the automation sensitive
        to charging spikes (a 10kW charge reduces apparent structural
        export by 10kW, potentially triggering a false solar_low event).
        Default: off (recommended — solar_ct - load only).
      default: false
      selector:
        boolean:

    hold_switch:
      name: "Hold Switch (optional)"
      description: >
        A switch or input_boolean that when ON prevents the reserve from
        being lowered back to normal. Use this to block lowering while
        pool heating or another high-priority load is actively running.
        Leave empty if not needed.
      default:
      selector:
        entity:
          domain:
            - switch
            - input_boolean

    notify_service:
      name: "Notification service (optional)"
      description: >
        Service for reserve-change notifications, e.g.
        notify.mobile_app_ralfs_iphone. Leave empty to disable.
      default: ""
      selector:
        text:

variables:
  phase_name: !input phase_name
  solar_ct_sensor: !input solar_ct_sensor
  load_sensor: !input load_sensor
  solar_threshold_w: !input solar_threshold_w
  backup_reserve_number: !input backup_reserve_number
  battery_soc_sensor: !input battery_soc_sensor
  battery_power_sensor: !input battery_power_sensor
  include_battery_in_forecast: !input include_battery_in_forecast
  hold_switch: !input hold_switch
  throttle_reserve_pct: !input throttle_reserve_pct
  normal_reserve_pct: !input normal_reserve_pct
  notify_service: !input notify_service
  octopus_cheap_rate_active: >
    {{ states('sensor.octopus_energy_electricity_25j0223825_2000012019734_current_rate') | float(999)
       < states('sensor.octopus_energy_electricity_25j0223825_2000012019734_next_rate') | float(0) }}

trigger:
  - platform: time_pattern
    minutes: "/1"
    id: periodic

  - platform: template
    value_template: >
      {% set solar = states(solar_ct_sensor) | float(0) %}
      {% set load = states(load_sensor) | float(0) %}
      {% set battery = states(battery_power_sensor) | float(0) if (include_battery_in_forecast and battery_power_sensor) else 0 %}
      {{ solar - load + battery > solar_threshold_w }}
    for:
      minutes: !input raise_hold_minutes
    id: solar_high

  - platform: template
    value_template: >
      {% set solar = states(solar_ct_sensor) | float(0) %}
      {% set load = states(load_sensor) | float(0) %}
      {% set battery = states(battery_power_sensor) | float(0) if (include_battery_in_forecast and battery_power_sensor) else 0 %}
      {{ solar - load + battery <= solar_threshold_w }}
    for:
      minutes: !input lower_hold_minutes
    id: solar_low

condition: []

action:
  - variables:
      soc_str: >
        {% if battery_soc_sensor %}
          {{ states(battery_soc_sensor) | float(0) | round(0) }}%
        {% else %}
          unknown
        {% endif %}
      battery_w: >
        {{ states(battery_power_sensor) | float(0) if (include_battery_in_forecast and battery_power_sensor) else 0 }}
      structural_export_w: >
        {{ (states(solar_ct_sensor) | float(0)
            - states(load_sensor) | float(0)
            + (states(battery_power_sensor) | float(0) if (include_battery_in_forecast and battery_power_sensor) else 0)) | round(0) }}
      solar_high_now: >
        {{ states(solar_ct_sensor) | float(0)
           - states(load_sensor) | float(0)
           + (states(battery_power_sensor) | float(0) if (include_battery_in_forecast and battery_power_sensor) else 0)
           > solar_threshold_w }}
      hold_active: >
        {{ hold_switch != none and is_state(hold_switch, 'on') }}
      current_reserve: >
        {{ states(backup_reserve_number) | float(0) | round(0) }}

  - choose:
      - conditions:
          - condition: trigger
            id: periodic
          - condition: template
            value_template: >
              {{ solar_high_now and current_reserve != throttle_reserve_pct }}
        sequence:
          - alias: "Periodic: solar high but reserve not raised — correct it"
            service: number.set_value
            target:
              entity_id: !input backup_reserve_number
            data:
              value: "{{ throttle_reserve_pct }}"

      - conditions:
          - condition: trigger
            id: periodic
          - condition: template
            value_template: >
              {{ not solar_high_now and current_reserve != normal_reserve_pct and not hold_active }}
          - condition: template
            value_template: "{{ not octopus_cheap_rate_active }}"
        sequence:
          - alias: "Periodic: solar low but reserve not restored — correct it"
            service: number.set_value
            target:
              entity_id: !input backup_reserve_number
            data:
              value: "{{ normal_reserve_pct }}"

      - conditions:
          - condition: trigger
            id: solar_high
        sequence:
          - alias: "Raise reserve — solar genuinely high"
            service: number.set_value
            target:
              entity_id: !input backup_reserve_number
            data:
              value: "{{ throttle_reserve_pct }}"
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "{{ phase_name }}: reserve raised to {{ throttle_reserve_pct }}%"
                  message: >
                    {{ phase_name }}: solar export {{ structural_export_w }}W exceeds
                    threshold {{ solar_threshold_w }}W — reserve raised to
                    {{ throttle_reserve_pct }}%. Battery SoC: {{ soc_str }}.

      - conditions:
          - condition: trigger
            id: solar_low
          - condition: template
            value_template: "{{ not hold_active }}"
          - condition: template
            value_template: "{{ not octopus_cheap_rate_active }}"
        sequence:
          - alias: "Restore reserve — solar sustainably low"
            service: number.set_value
            target:
              entity_id: !input backup_reserve_number
            data:
              value: "{{ normal_reserve_pct }}"
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "{{ phase_name }}: reserve restored to {{ normal_reserve_pct }}%"
                  message: >
                    {{ phase_name }}: solar export {{ structural_export_w }}W below
                    threshold {{ solar_threshold_w }}W — reserve restored to
                    {{ normal_reserve_pct }}%. Battery SoC: {{ soc_str }}.

mode: restart
