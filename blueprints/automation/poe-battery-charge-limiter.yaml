# =============================================================================
# poe-battery-charge-limiter.yaml
#
# v1.2
#
# Design:
#   Keeps a battery-powered device (iPad, phone, etc.) on a charge window
#   rather than continuously topped up, by toggling the PoE power switch
#   entity that supplies its charger/dock. Mirrors the low/high hysteresis
#   pattern used for the Powerwall backup reserve blueprints in this repo,
#   but driven by a simple battery_level sensor instead of Octopus rates.
#
#   Triggers:
#     - numeric_state below low_threshold  -> turn PoE on  (needs charging)
#     - numeric_state above high_threshold -> turn PoE off (fully charged)
#     - state held unchanged for stale_after -> turn PoE on unconditionally
#       (safety net; see v1.2 note below)
#     - homeassistant: start                -> falls through to `default:`,
#       which resyncs immediately against current battery level rather than
#       waiting up to the next crossing (same rationale as the
#       `homeassistant: start` branch added in
#       powerwall-battery-export-window.yaml v2.0)
#
#   v1.1 fix #1: manually running the automation (UI "Run" button, or any
#   call to automation.trigger without a real trigger context) previously did
#   NOTHING — the choose action only matched on trigger id (low/high/resync),
#   and a manual run has no trigger id, so no branch matched. Replaced the
#   third `resync`-only branch with a `default:` on the choose action, so
#   ANY run without a matching low/high trigger id (manual run OR HA restart)
#   falls through to the same current-level resync logic. This also makes
#   the homeassistant:start trigger's `id: resync` unnecessary — removed.
#
#   v1.1 fix #2: the resync/default sequence templated `states(battery_sensor)`
#   but `battery_sensor` was never bound as a top-level `variables:` entry
#   (only low_threshold/high_threshold were) — present since v1.0, silently
#   uncaught because the old resync-only branch never actually ran until fix
#   #1 exposed it via a manual test run (UndefinedError: 'battery_sensor' is
#   undefined). Added `battery_sensor: !input battery_sensor` alongside the
#   other two variables.
#
#   v1.2: added a stale-data safety net. The Spa iPad died with PoE stuck
#   off — its Companion-app battery_level had last reported 75% hours
#   earlier, never crossing below low_threshold before the device died and
#   stopped pushing updates (iOS throttles/stops background app activity as
#   a device gets critically low or powers off). The 20/80% hysteresis only
#   works if the sensor keeps reporting all the way down, which isn't
#   guaranteed. Added a `state` trigger with `for: stale_after` (default 4h)
#   on battery_sensor — if the reading hasn't changed (i.e. no new push) in
#   that long, turn PoE on unconditionally, on the assumption a live/awake
#   device reports far more often than that. Caveat: `for:` duration clocks
#   reset on every HA restart, so a restart delays stale detection by up to
#   stale_after from restart time — acceptable here since worst case is a
#   late safety-net trigger, not a missed one.
#
#   Intentionally NOT included:
#     - No debounce/hold time on the threshold crossings — battery_level
#       sensors from the HA Companion app update slowly and irregularly
#       already (background push-triggered), so added debounce is unlikely
#       to help and would only delay response further.
#     - No "battery_state" (charging/not charging) check — PoE presence is
#       the thing being controlled, so checking it would be circular.
#
# Before relying on this:
#   - Companion app battery_level sensor updates are push-driven and can lag
#     by minutes; this is a coarse charge window, not precise SoC control.
#   - Confirm the poe_outlet_switch input is the *_poe suffixed "Outlet"
#     entity, not the plain port data/link switch — see 2026-07-31 SW-Spa
#     port 5 troubleshooting (wrong sibling entity toggles link, not power).
#
# Instances (created 2026-07-31):
#   - Spa iPad:     sensor.spa_ipad_battery_level     / switch.sw_spa_poe_out_data_poe_5
#   - Kitchen iPad:  sensor.kitchen_ipad_battery_level / switch.sw_upstairs_port_5_poe
# =============================================================================

blueprint:
  name: PoE Battery Charge Limiter
  description: >
    Turns a PoE power switch on when a battery sensor drops below a low
    threshold, and off when it rises above a high threshold — keeping a
    PoE-charged device (tablet, phone) within a charge window instead of
    trickle-charging continuously. Resyncs against current battery level
    on HA restart.
  domain: automation
  source_url: https://github.com/rholighaus/ha_blueprints/blob/main/blueprints/automation/poe-battery-charge-limiter.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    devices:
      name: Devices
      icon: mdi:battery-charging
      input:
        battery_sensor:
          name: Battery level sensor
          description: The device's battery_level sensor (e.g. from HA Companion app).
          selector:
            entity:
              domain: sensor
              device_class: battery
        poe_outlet_switch:
          name: PoE outlet switch
          description: >
            The *_poe "Outlet" switch entity for the port supplying this
            device's charger — not the plain port data/link switch.
          selector:
            entity:
              domain: switch
    settings:
      name: Settings
      icon: mdi:cog
      collapsed: true
      input:
        low_threshold:
          name: Low threshold (turn on)
          default: 20
          selector:
            number: { min: 1, max: 99, unit_of_measurement: "%", mode: slider }
        high_threshold:
          name: High threshold (turn off)
          default: 80
          selector:
            number: { min: 1, max: 99, unit_of_measurement: "%", mode: slider }
        stale_after:
          name: Stale-data safety net
          description: >
            If the battery sensor hasn't reported an update in this long,
            turn PoE on regardless of the last known level. Protects
            against a device that dies or goes unreachable before ever
            reporting a reading below the low threshold.
          default:
            hours: 4
          selector:
            duration:
              enable_day: false

mode: restart
max_exceeded: silent

variables:
  battery_sensor: !input battery_sensor
  low_threshold: !input low_threshold
  high_threshold: !input high_threshold

triggers:
  - trigger: numeric_state
    entity_id: !input battery_sensor
    below: !input low_threshold
    id: low
  - trigger: numeric_state
    entity_id: !input battery_sensor
    above: !input high_threshold
    id: high
  - trigger: state
    entity_id: !input battery_sensor
    for: !input stale_after
    id: stale
  - trigger: homeassistant
    event: start

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: low
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input poe_outlet_switch
      - conditions:
          - condition: trigger
            id: high
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input poe_outlet_switch
      - conditions:
          - condition: trigger
            id: stale
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input poe_outlet_switch
    default:
      # Covers: HA restart, and any manual/no-context run (e.g. UI "Run"
      # button) where trigger.id doesn't match low/high — resync against
      # the battery sensor's current value instead of doing nothing.
      - variables:
          current_level: "{{ states(battery_sensor) | float(0) }}"
      - if:
          - condition: template
            value_template: "{{ current_level < low_threshold }}"
        then:
          - action: switch.turn_on
            target:
              entity_id: !input poe_outlet_switch
      - if:
          - condition: template
            value_template: "{{ current_level > high_threshold }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: !input poe_outlet_switch
