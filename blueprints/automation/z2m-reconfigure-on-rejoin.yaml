# =============================================================================
# z2m-reconfigure-on-rejoin.yaml
#
# v3.1
#
# Design:
#   Some Tuya TS0601 battery blind motors (Zemismart ZM25RX-08/30,
#   _TZE200_bv1jcqqu) periodically stop acting on commands while staying on
#   the network: Z2M sends the command without error, the motor doesn't
#   move, and it may even report a bogus position (seen 2026-10-03: right
#   blind reported 100 -> 75 without physically moving). Clicking
#   "Reconfigure" in Z2M wakes it up.
#
#   Three triggers, one automation (mode parallel):
#
#   1. COMMAND (call_service event, domain cover)
#      - open_cover / close_cover / set_cover_position / stop_cover calls
#        naming one of the selected covers (directly or via a cover group,
#        which re-calls the service with its members).
#      - for each matched blind, fires a `z2m_blind_watchdog` event carrying
#        entity, kind, target_pos (open=100, close=0, set=requested) and
#        start_pos, tagged with this automation's entity_id as `source`.
#      - catches repeated presses (no state change needed). Commands sent
#        from the Z2M frontend bypass HA and are NOT watched.
#
#   2. CHECK (z2m_blind_watchdog event from this automation)
#      - skipped if kind is stop_cover, or the blind is already within +-5
#        of the target (avoids daily reconfigures from timed automations).
#      - healthy = the blind's own Z2M state message (<base>/<friendly
#        name>) reports position within +-5 of target, at least 1 s after
#        the check started (skips Z2M's optimistic echo), within
#        move_timeout (default 35 s; measured full travel ~19 s). A report
#        that doesn't reach the target (bogus value) counts as STUCK.
#        Residual gap: an unrelated message from a stuck blind (e.g. a
#        battery report) after a set_cover_position would echo the cached
#        optimistic target and count as reached.
#      - a newer command or a stop for the same blind supersedes the check
#        (the newer command starts its own check), so Stop and quick
#        reversals never cause a re-send.
#      - stuck -> configure (retries) -> re-send ONCE straight to Z2M via
#        MQTT <base>/<ieee>/set ({"state": OPEN|CLOSE} or {"position": N}),
#        bypassing the HA cover service so the re-send can't re-trigger the
#        watchdog -> check again -> notify.
#
#   3. ANNOUNCE (mqtt <base>/bridge/event)
#      - device_announce / device_joined from a selected blind -> configure.
#        Kept from v1.0 as a cheap extra; the diagnosed hang does not
#        involve a rejoin.
#
#   Device matching: IEEE addresses are derived from each cover's HA device
#   identifiers (zigbee2mqtt_0x...).
#
#   dry_run (default ON): detects and notifies only - no configure, no
#   re-send.
#
#   No homeassistant: start branch (nothing to resync). Manual "Run" does
#   nothing.
#
#   History:
#     v1.0 (2026-10-03) rejoin watcher only.
#     v2.0 (2026-10-03) state-trigger watchdog; any position change = healthy.
#          Failed live test: bogus position report counted as movement, and
#          repeated presses didn't trigger (no state change).
#     v3.0 (2026-10-03) call_service trigger, reach-target criterion,
#          set_cover_position support, stop/supersede guard, MQTT re-send.
#          Inputs unchanged from v2.0.
#     v3.1 (2026-10-03) "reached" is now judged from the blind's own Z2M
#          state messages (<base>/<friendly name>), not HA's stored
#          position: Z2M writes the TARGET into position within ~50 ms of a
#          set_cover_position command (optimistic), so v3.0 saw "reached"
#          instantly for position commands (e.g. from "Sync Ralf's
#          Blinds"). Messages within 1 s of the check starting are ignored.
#          Default move_timeout 75 -> 35 s (measured full travel ~19 s,
#          Ralf left blind). Inputs unchanged.
# =============================================================================

blueprint:
  name: Z2M – recover stuck blinds (reconfigure + resend) (v3.1)
  description: >
    v3.1 — Watchdog for Zigbee2MQTT battery blind motors (e.g. Tuya TS0601)
    that stop acting on commands until reconfigured. When a selected cover is
    commanded (open/close/set position) from HA and doesn't reach the target
    position within the timeout, sends a Z2M "configure" request and re-sends
    the command once. A Stop or newer command cancels the check. Also
    reconfigures a blind when it re-announces/rejoins. Dry run (default)
    only notifies.
  domain: automation
  author: Ralf
  source_url: https://github.com/rholighaus/ha_blueprints/blob/main/blueprints/automation/z2m-reconfigure-on-rejoin.yaml
  input:
    base_topic:
      name: Z2M base topic
      description: MQTT base topic of the Zigbee2MQTT instance (e.g. zigbee2mqtt_1).
      default: zigbee2mqtt
      selector:
        text: {}
    covers:
      name: Blinds to watch
      description: Zigbee2MQTT cover entities to watch.
      selector:
        entity:
          multiple: true
          filter:
            - domain: cover
              integration: mqtt
    move_timeout:
      name: Movement timeout (seconds)
      description: >
        How long the blind has to reach the commanded position before it is
        treated as stuck. Set above full travel time.
      default: 35
      selector:
        number:
          min: 15
          max: 600
          unit_of_measurement: s
          mode: box
    max_attempts:
      name: Max configure attempts
      default: 3
      selector:
        number:
          min: 1
          max: 10
          mode: box
    retry_delay:
      name: Delay between configure attempts (seconds)
      default: 20
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: s
          mode: box
    persistent_notify:
      name: Persistent notification on every intervention
      default: true
      selector:
        boolean: {}
    notify_service:
      name: Push notify service on failure
      description: >
        Full action name, e.g. notify.mobile_app_ralfs_iphone. Used when
        configure fails, or the blind still doesn't reach the target after the
        re-send. Leave empty to disable.
      default: notify.mobile_app_ralfs_iphone
      selector:
        text: {}
    dry_run:
      name: Dry run (notify only — no configure, no re-send)
      default: true
      selector:
        boolean: {}

mode: parallel
max: 25

trigger_variables:
  base: !input base_topic

triggers:
  - trigger: event
    id: command
    event_type: call_service
    event_data:
      domain: cover
  - trigger: event
    id: check
    event_type: z2m_blind_watchdog
  - trigger: mqtt
    id: announce
    topic: "{{ base }}/bridge/event"

variables:
  covers: !input covers
  move_timeout: !input move_timeout
  attempts: !input max_attempts
  retry_delay: !input retry_delay
  persistent_notify: !input persistent_notify
  notify_service: !input notify_service
  dry_run: !input dry_run
  self_id: "{{ this.entity_id }}"
  covers_info: >
    {% set ns = namespace(l=[]) %}
    {% for c in covers %}
      {% set d = device_id(c) %}
      {% for i in ((device_attr(d, 'identifiers') or []) if d else []) %}
        {% for m in (i[1] | string | regex_findall('0x[0-9a-fA-F]{16}')) %}
          {% set ns.l = ns.l + [{'entity': c, 'ieee': m | lower}] %}
        {% endfor %}
      {% endfor %}
    {% endfor %}
    {{ ns.l }}
  # --- command trigger ---
  svc: >
    {% if trigger.id == 'command' %}{{ trigger.event.data.get('service', '') }}{% endif %}
  matched: >
    {% if trigger.id == 'command' %}
      {% set e = (trigger.event.data.get('service_data') or {}).get('entity_id') or [] %}
      {% set ids = (e.split(',') | map('trim') | list) if e is string else (e | list) %}
      {{ ids | select('in', covers) | list }}
    {% else %}[]{% endif %}
  # --- announce trigger ---
  event_type: >
    {% if trigger.id == 'announce' and trigger.payload_json is defined
          and trigger.payload_json is mapping %}{{ trigger.payload_json.get('type', '') }}{% endif %}
  ann_ieee: >
    {% if trigger.id == 'announce' and trigger.payload_json is defined
          and trigger.payload_json is mapping %}{{ (trigger.payload_json.get('data') or {}).get('ieee_address', '') | lower }}{% endif %}
  # --- check trigger ---
  kind: >
    {% if trigger.id == 'check' %}{{ trigger.event.data.get('kind', '') }}{% endif %}
  target_pos: >
    {{ (trigger.event.data.get('target_pos', -1) | int(-1)) if trigger.id == 'check' else -1 }}
  start_pos: >
    {{ (trigger.event.data.get('start_pos', -1) | int(-1)) if trigger.id == 'check' else -1 }}
  # --- common ---
  entity: >
    {% if trigger.id == 'check' %}{{ trigger.event.data.get('entity', '') }}{% elif trigger.id == 'announce' %}{{ (covers_info | selectattr('ieee', 'eq', ann_ieee) | map(attribute='entity') | first) | default('') }}{% endif %}
  ieee: >
    {% if trigger.id == 'announce' %}{{ ann_ieee }}{% elif trigger.id == 'check' %}{{ (covers_info | selectattr('entity', 'eq', entity) | map(attribute='ieee') | first) | default('') }}{% endif %}
  name: >
    {{ (state_attr(entity, 'friendly_name') if entity else none) or ieee }}
  z2m_name: >
    {{ (device_attr(device_id(entity), 'name') if entity and device_id(entity) else '') or '' }}

conditions:
  - condition: template
    value_template: >
      {{ (trigger.id == 'command'
          and svc in ['open_cover', 'close_cover', 'set_cover_position', 'stop_cover']
          and matched | count > 0)
         or (trigger.id == 'check'
          and trigger.event.data.get('source') == self_id
          and kind != 'stop_cover'
          and ieee != ''
          and z2m_name != ''
          and target_pos >= 0
          and (start_pos - target_pos) | abs > 5)
         or (trigger.id == 'announce'
          and event_type in ['device_announce', 'device_joined']
          and entity != '') }}

actions:
  # === 1. COMMAND: hand each matched blind to its own check run ==============
  - if:
      - condition: trigger
        id: command
    then:
      - repeat:
          for_each: "{{ matched }}"
          sequence:
            - event: z2m_blind_watchdog
              event_data:
                source: "{{ self_id }}"
                entity: "{{ repeat.item }}"
                kind: "{{ svc }}"
                target_pos: >
                  {% if svc == 'open_cover' %}100{% elif svc == 'close_cover' %}0{% elif svc == 'set_cover_position' %}{{ (trigger.event.data.get('service_data') or {}).get('position', -1) | int(-1) }}{% else %}-1{% endif %}
                start_pos: "{{ state_attr(repeat.item, 'current_position') | int(-1) }}"
      - stop: Handed to watchdog

  # === 2. CHECK: wait for the blind to reach the target =====================
  - variables:
      outcome: pending
      check_start: "{{ now().timestamp() }}"
      deadline: "{{ now().timestamp() + (move_timeout | int) }}"
      recovered: true
  - if:
      - condition: trigger
        id: check
    then:
      - repeat:
          sequence:
            - wait_for_trigger:
                - trigger: mqtt
                  topic: "{{ base }}/{{ z2m_name }}"
                - trigger: event
                  event_type: z2m_blind_watchdog
              timeout: "{{ [deadline - now().timestamp(), 0] | max }}"
              continue_on_timeout: true
            - variables:
                outcome: >
                  {% if wait.trigger is none %}timeout
                  {% elif wait.trigger.event is not defined %}{% set p = (wait.trigger.payload_json.position | default(-1000)) if wait.trigger.payload_json is defined and wait.trigger.payload_json is mapping else -1000 %}{{ 'reached' if ((p | int(-1000)) - target_pos) | abs <= 5 and now().timestamp() > check_start + 1 else 'pending' }}
                  {% elif wait.trigger.event.data.get('entity') == entity
                       and wait.trigger.event.data.get('source') == self_id %}superseded
                  {% else %}pending{% endif %}
          until:
            - condition: template
              value_template: "{{ outcome != 'pending' }}"
      - if:
          - condition: template
            value_template: "{{ outcome in ['reached', 'superseded'] }}"
        then:
          - stop: "Blind {{ outcome }} - no action needed"

  # === Dry run ===============================================================
  - if:
      - condition: template
        value_template: "{{ dry_run }}"
    then:
      - action: persistent_notification.create
        data:
          title: "Z2M blind recovery (dry run)"
          message: >
            {% if trigger.id == 'check' %}{{ name }}: {{ kind }} to {{ target_pos }}
            but it didn't get there within {{ move_timeout }} s (position now
            {{ state_attr(entity, 'current_position') }}) — would reconfigure
            and re-send.{% else %}{{ name }} sent {{ event_type }} on {{ base }}
            — would reconfigure.{% endif %}
      - stop: Dry run

  - if:
      - condition: trigger
        id: announce
    then:
      - delay: "00:00:05"

  # === Configure, with retries (check + announce) ============================
  - repeat:
      sequence:
        - action: mqtt.publish
          data:
            topic: "{{ base }}/bridge/request/device/configure"
            payload: "{{ {'id': ieee} | to_json }}"
        - wait_for_trigger:
            - trigger: mqtt
              topic: "{{ base }}/bridge/response/device/configure"
          timeout: "00:00:30"
          continue_on_timeout: true
        - if:
            - condition: template
              value_template: >
                {{ not (wait.trigger is not none
                        and wait.trigger.payload_json.status == 'ok'
                        and wait.trigger.payload_json.data.id == ieee)
                   and repeat.index < attempts }}
          then:
            - delay:
                seconds: "{{ retry_delay }}"
      until:
        - condition: template
          value_template: >
            {{ (wait.trigger is not none
                and wait.trigger.payload_json.status == 'ok'
                and wait.trigger.payload_json.data.id == ieee)
               or repeat.index >= attempts }}

  - variables:
      ok: >
        {{ wait.trigger is not none
           and wait.trigger.payload_json.status == 'ok'
           and wait.trigger.payload_json.data.id == ieee }}

  # === CHECK: re-send once straight to Z2M, then verify ======================
  - if:
      - condition: trigger
        id: check
      - condition: template
        value_template: "{{ ok }}"
    then:
      - delay: "00:00:03"
      - action: mqtt.publish
        data:
          topic: "{{ base }}/{{ ieee }}/set"
          payload: >
            {% if kind == 'open_cover' %}{{ {'state': 'OPEN'} | to_json }}{% elif kind == 'close_cover' %}{{ {'state': 'CLOSE'} | to_json }}{% else %}{{ {'position': target_pos} | to_json }}{% endif %}
      - variables:
          outcome: pending
          check_start: "{{ now().timestamp() }}"
          deadline: "{{ now().timestamp() + (move_timeout | int) }}"
      - repeat:
          sequence:
            - wait_for_trigger:
                - trigger: mqtt
                  topic: "{{ base }}/{{ z2m_name }}"
                - trigger: event
                  event_type: z2m_blind_watchdog
              timeout: "{{ [deadline - now().timestamp(), 0] | max }}"
              continue_on_timeout: true
            - variables:
                outcome: >
                  {% if wait.trigger is none %}timeout
                  {% elif wait.trigger.event is not defined %}{% set p = (wait.trigger.payload_json.position | default(-1000)) if wait.trigger.payload_json is defined and wait.trigger.payload_json is mapping else -1000 %}{{ 'reached' if ((p | int(-1000)) - target_pos) | abs <= 5 and now().timestamp() > check_start + 1 else 'pending' }}
                  {% elif wait.trigger.event.data.get('entity') == entity
                       and wait.trigger.event.data.get('source') == self_id %}superseded
                  {% else %}pending{% endif %}
          until:
            - condition: template
              value_template: "{{ outcome != 'pending' }}"
      - variables:
          recovered: "{{ outcome != 'timeout' }}"

  # === Notifications =========================================================
  - if:
      - condition: template
        value_template: "{{ persistent_notify }}"
    then:
      - action: persistent_notification.create
        data:
          title: "Z2M blind recovery"
          message: >
            {% if trigger.id == 'check' %}{{ name }} didn't reach {{ target_pos }}
            after {{ kind }}. Configure {{ 'ok' if ok else 'FAILED after ' ~ attempts ~ ' attempts' }}{% if ok %};
            re-sent — {{ 'reached target' if outcome == 'reached' else ('superseded by a newer command' if outcome == 'superseded' else 'STILL NOT THERE (position ' ~ state_attr(entity, 'current_position') ~ ')') }}{% endif %}.{% else %}{{ name }}
            sent {{ event_type }}; configure
            {{ 'succeeded' if ok else 'FAILED after ' ~ attempts ~ ' attempts' }}.{% endif %}

  - if:
      - condition: template
        value_template: >
          {{ (not ok or not recovered) and (notify_service | string | trim) != '' }}
    then:
      - action: "{{ notify_service }}"
        continue_on_error: true
        data:
          title: "Z2M blind still stuck"
          message: >
            {{ name }}:
            {{ 'configure failed after ' ~ attempts ~ ' attempts'
               if not ok else 're-sent ' ~ kind ~ ' but it still did not reach ' ~ target_pos }}.
            Try Reconfigure in Z2M or check the motor.
